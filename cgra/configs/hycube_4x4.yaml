# Morpher configuration for Terracotta CGRA trigger evaluation
# Targets HyCUBE 4x4 architecture (default Morpher target)
#
# We evaluate each technique's trigger kernel at multiple grid sizes
# to explore the area-latency tradeoff.

---
# HyCUBE 4x4 — baseline CGRA configuration
json_arch: "hycube_original_mem.json"
json_arch_before_memupdate: 'hycube_original_updatemem.json'
mapper_subfolder: 'hycube'
dfg_type: 'PartPred'
init_II: 0
ydim: 4
xdim: 4
numberofbanks: 2
banksize: 2048
max_test_samples: 5
mapping_method: 0
llvm_debug_type: 'no'
morpher_light: 'no'
