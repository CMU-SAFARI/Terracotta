Frontend:
  impl: BHO3
  clock_ratio: 8
  num_expected_insts: 100000000
  num_max_cycles: 10000000000
  llc_capacity_per_core: 2MB
  llc_linesize: 64
  llc_associativity: 16
  llc_num_mshr_per_core: 16
  ipc: 4
  inst_window_depth: 256
  traces: 
    - sample_traces/505.mcf

  Translation:
    impl: RandomTranslation 
    max_addr: 2147483648

MemorySystem:
  impl: BHDRAMSystem
  clock_ratio: 3

  DRAM:
    impl: DDR5-VRR
    org:
      preset: DDR5_16Gb_x8
      channel: 1
      rank: 1
      channel_width: 32
    timing:
      preset: DDR5_3200AN 
    RFM:
      BRC: 2
    PRAC: false
    drampower_enable: true
    voltage:
      preset: Default
    current:
      preset: Default

  BHDRAMController:
    impl: BHDRAMController
    BHScheduler:
      impl: BHScheduler
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: ClosedRowPolicy
      cap: 4
    plugins:
      - ControllerPlugin:
          impl: DummyMitigation
    controller_latency: 8

  AddrMapper:
    impl: RoBaRaCoCh
