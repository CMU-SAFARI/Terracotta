# ChargeCacheMASA technique manifest.
#
# Declarative description of ChargeCacheMASA's experiment matrix. Consumed by the shared
# common/ harness. Replaces chargecachemasa/common/config.py + setup_sim.py + cgra_setup_sim.py.
#
# ChargeCacheMASA is the composite case study: it compares baseline, ChargeCache, MASA, and
# the combined ChargeCacheMASA controller, each in a custom and a Terracotta form, plus a
# bus-utilization-threshold family (t020..t050). The threshold points are shipped as
# separate config YAMLs (each bakes in its own AdaptiveCC.bus_util_threshold), so they are
# modelled as distinct variants rather than a parameter sweep.

technique: ChargeCacheMASA
dir: chargecachemasa
frontend: SimpleO3

# controller_latency = baseline_latency + overhead.
#   custom ChargeCache / ChargeCacheMASA: +1 (CC_LATENCY_OVERHEAD)
#   Terracotta (Tables): +2 (latency_sweep, name-suffixed)
#   Terracotta-CGRA: +8 (old CGRA_LATENCY)
baseline_latency: 8

variants:
  baseline:
    config: baseline.yaml
    latency_overhead: 0                     # 8

  # --- Custom controllers (Tables comparison points) ---
  chargecache:
    config: cc.yaml
    latency_overhead: 1                     # 9 (CC_LATENCY_OVERHEAD)
  masa:
    config: masa.yaml
    latency_overhead: 0                     # 8
  chargecachemasa:
    config: chargecachemasa.yaml
    latency_overhead: 1                     # 9 (CC_LATENCY_OVERHEAD)

  # --- Terracotta (Tables) forms ---
  terracotta_chargecache:
    config: terracotta_chargecache.yaml
    latency_sweep: [2]                      # 10
  terracotta_masa:
    config: terracotta_masa.yaml
    latency_sweep: [2]                      # 10
  terracotta_chargecachemasa:
    config: terracotta_chargecachemasa.yaml
    latency_sweep: [2]                      # 10

  # --- Terracotta (Tables) bus_util_threshold family: MULTI-CORE ONLY (as in setup_sim.py) ---
  terracotta_chargecachemasa_t020:
    config: terracotta_chargecachemasa_t020.yaml
    latency_sweep: [2]                      # 10
    core_setups: [four_core]
  terracotta_chargecachemasa_t030:
    config: terracotta_chargecachemasa_t030.yaml
    latency_sweep: [2]
    core_setups: [four_core]
  terracotta_chargecachemasa_t040:
    config: terracotta_chargecachemasa_t040.yaml
    latency_sweep: [2]
    core_setups: [four_core]
  terracotta_chargecachemasa_t050:
    config: terracotta_chargecachemasa_t050.yaml
    latency_sweep: [2]
    core_setups: [four_core]

  # --- Terracotta-CGRA forms (single + four core; no name suffix) ---
  terracotta_cgra_chargecachemasa:
    config: terracotta_cgra_chargecachemasa.yaml
    latency_overhead: 8                     # 16
  terracotta_cgra_chargecachemasa_t020:
    config: terracotta_cgra_chargecachemasa_t020.yaml
    latency_overhead: 8
  terracotta_cgra_chargecachemasa_t030:
    config: terracotta_cgra_chargecachemasa_t030.yaml
    latency_overhead: 8
  terracotta_cgra_chargecachemasa_t040:
    config: terracotta_cgra_chargecachemasa_t040.yaml
    latency_overhead: 8
  terracotta_cgra_chargecachemasa_t050:
    config: terracotta_cgra_chargecachemasa_t050.yaml
    latency_overhead: 8

  # --- Adaptive bus-util-threshold variant (RETAINED) ---
  # Not generated by setup_sim.py; its source is the separate weighted-speedup
  # investigation (old run_hhhh_experiment.py). Kept as a first-class four-core variant so
  # the config is retained. Built verbatim + the standard overrides, matching that script's
  # build_config for the no-threshold-override case. verify_equivalence lists it via allow_new.
  terracotta_chargecachemasa_adaptive:
    config: terracotta_chargecachemasa_adaptive.yaml
    latency_sweep: [2]                      # 10
    core_setups: [four_core]

core_setups:
  single_core:
    cores: 1
    channels: 1
    mix: ../../common/mixes/single.mix
  four_core:
    cores: 4
    channels: 1
    mix: ../../common/mixes/four.mix

run:
  num_expected_insts: 100000000
  num_max_cycles: 10000000000

figures:
  # Main ChargeCacheMASA comparison (custom vs Terracotta forms of CC / MASA / CCMASA).
  # Paper figure number to be confirmed in Phase 4.
  - id: main_speedup
    compares: [baseline, chargecache, masa, chargecachemasa, terracotta_chargecachemasa]
    metric: speedup_over_baseline
  # bus_util_threshold sensitivity (four-core).
  - id: threshold_sweep
    compares: [terracotta_chargecachemasa_t020, terracotta_chargecachemasa_t030,
               terracotta_chargecachemasa_t040, terracotta_chargecachemasa_t050,
               terracotta_chargecachemasa_adaptive]
    metric: speedup_over_baseline
  # Fig. 16 (paper §8.7): Terracotta-CGRA vs Terracotta-Tables vs custom.
  - id: figure16
    compares: [chargecachemasa, terracotta_chargecachemasa, terracotta_cgra_chargecachemasa]
    metric: speedup_over_baseline
