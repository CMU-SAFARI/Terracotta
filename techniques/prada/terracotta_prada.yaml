Frontend:
  impl: PuMO3
  clock_ratio: 8
  num_iterations: 8
  llc_capacity_per_core: 2MB
  llc_linesize: 64
  llc_associativity: 16
  llc_num_mshr_per_core: 16
  ipc: 4
  inst_window_depth: 256
  operation: copy
  traces: 
    - sample_traces/pum_1ip

  Translation:
    impl: NoTranslation
    max_addr: 2147483648
              

MemorySystem:
  impl: PuMDRAM
  clock_ratio: 3

  DRAM:
    impl: TerracottaDDR5PRADA
    org:
      preset: DDR5_16Gb_x8
      channel: 1
      rank: 1
      channel_width: 32
    timing:
      preset: DDR5_3200AN
    RFM:
      BRC: 2
    PRAC: true
    drampower_enable: true
    voltage:
      preset: Default
    current:
      preset: Default

  Controller:
    impl: PuMController
    Scheduler:
      impl: PuMScheduler
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: ClosedRowPolicy
      cap: 4
    plugins:
    controller_latency: 10

  AddrMapper:
    impl: RoBaRaCoCh
